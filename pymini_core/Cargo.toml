[package]
name = "pymini_core"
version = "0.1.0"
edition = "2024"

[lib]
name = "pymini_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module"] }
solana-sdk = "1.18"
solana-client = "1.18"
anchor-client = "0.29.0"
anchor-lang = "0.29.0"
borsh = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
